<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KBrowser</title>
<style>
:root{--chrome-h:70px;--bookmark-h:0px}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font:13px "Malgun Gothic","Segoe UI",sans-serif;color:#20252a;background:#fff}button,input,select,textarea{font:inherit}.top{height:calc(var(--chrome-h) + var(--bookmark-h));background:linear-gradient(#f8fafc,#dce6f0);border-bottom:1px solid #84919d}.tabsbar{height:28px;display:flex;align-items:flex-end;padding:1px 2px 0;gap:1px;background:linear-gradient(#edf2f7,#cfdae5);border-bottom:1px solid #9ba7b3}.tabs{display:flex;gap:1px;flex:1;min-width:0;overflow:hidden}.tab{height:27px;min-width:100px;max-width:200px;display:flex;align-items:center;gap:2px;padding:0 3px;border:1px solid #98a5b1;border-radius:3px 3px 0 0;background:linear-gradient(#edf1f4,#c6d0da);white-space:nowrap}.tab.active{background:#fff;border-bottom-color:#fff}.tab-title{overflow:hidden;text-overflow:ellipsis;flex:1}.tab-x{border:0;background:transparent;font-size:13px;padding:0 2px}.newtab{width:27px;height:25px;margin-bottom:1px;border:1px solid #96a4b2;border-radius:3px;background:linear-gradient(#fff,#d8e2ec);font-size:16px;padding:0}.toolbar{height:41px;display:flex;align-items:center;gap:1px;padding:2px;background:linear-gradient(#fbfcfd,#e1e7ed);border-bottom:1px solid #adb8c3}.btn{height:29px;min-width:31px;border:1px solid #99a7b5;border-radius:3px;background:linear-gradient(#fff,#d6e0e9);padding:0 3px}.btn:hover{background:linear-gradient(#fff,#c8e3f8);border-color:#6d9ec4}.addresswrap{height:29px;display:flex;align-items:center;flex:1;border:1px solid #7f8f9f;background:#fff;border-radius:2px}.lock{width:23px;text-align:center;color:#65717a}.address{flex:1;height:26px;border:0;outline:0;padding:1px 2px}.star{width:28px;height:26px;border:0;background:transparent;font-size:17px;color:#7d8893;padding:0}.iconbtn{font-size:17px;line-height:1}.bookmarkbar{display:none;height:24px;align-items:center;gap:1px;padding:1px 2px;background:linear-gradient(#f5f7f9,#e4e9ee);border-bottom:1px solid #b5bec7;overflow:hidden;white-space:nowrap}.bookmarks-visible{--bookmark-h:24px}.bookmarks-visible .bookmarkbar{display:flex}.bookmark{height:20px;display:inline-flex;align-items:center;gap:2px;max-width:150px;padding:0 3px;border:1px solid transparent;border-radius:2px;cursor:pointer;overflow:hidden}.bookmark:hover,.bookmark.dragover{border-color:#7ea5c8;background:#fff}.bookmark img{width:16px;height:16px;flex:none}.bookmark span{overflow:hidden;text-overflow:ellipsis}.bookmark.favicon-only{width:22px;padding:1px 2px}.browserarea{position:absolute;left:0;right:0;top:calc(var(--chrome-h) + var(--bookmark-h));bottom:20px}.view{position:absolute;inset:0;width:100%;height:100%;display:none}.view.active{display:flex}.status{position:absolute;left:0;right:0;bottom:0;height:20px;display:flex;align-items:center;gap:4px;padding:0 2px;background:linear-gradient(#f6f7f8,#dde2e6);border-top:1px solid #a3abb2;font-size:13px;color:#4c545b}.statusmsg{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.panel{position:fixed;z-index:30;right:3px;top:66px;width:340px;max-height:450px;overflow:auto;background:#fff;border:1px solid #7f8d9b;box-shadow:0 2px 6px #0004;border-radius:3px;padding:3px;font-size:13px}.bookmarks-visible .panel{top:90px}.panel[hidden]{display:none}.panel h3{margin:3px 2px}.item{padding:2px 3px;border-bottom:1px solid #eee;cursor:pointer;line-height:20px}.item:hover{background:#eef6fd}.small{font-size:13px;color:#687580;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row{display:flex;align-items:center;gap:2px}.grow{flex:1;min-width:0}.mini{height:22px;padding:0 3px;border:1px solid #aab5bf;background:#fff;border-radius:2px}.checks{display:grid;gap:2px;padding:3px;border-bottom:1px solid #ddd}.checks label{display:flex;align-items:center;gap:3px}.modal{position:fixed;z-index:40;inset:0;background:#0006;display:grid;place-items:center}.modal[hidden]{display:none}.card{width:min(700px,calc(100vw - 20px));max-height:min(620px,calc(100vh - 26px));background:#fff;border:1px solid #78848f;border-radius:3px;display:flex;flex-direction:column;overflow:hidden}.cardhead{height:32px;display:flex;align-items:center;padding:0 3px;background:linear-gradient(#fff,#dfe7ef);border-bottom:1px solid #a9b3bd}.cardhead strong{flex:1}.cardbody{flex:1;overflow:auto;padding:3px}.close{width:27px;height:24px;padding:0}.field{display:grid;grid-template-columns:90px 1fr;gap:3px;align-items:center;margin:3px 0}.field input,.field textarea,.field select{width:100%;padding:2px 3px;border:1px solid #aab5bf}.actions{display:flex;justify-content:flex-end;gap:3px;margin-top:5px}.textarea{width:100%;height:100%;min-height:500px;resize:none;font:13px Consolas,monospace}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:3px}.pic{border:1px solid #ccc;padding:2px;min-height:140px}.pic img{width:100%;height:110px;object-fit:contain;background:#f1f1f1}.pic div{font-size:13px;word-break:break-all;max-height:36px;overflow:hidden}.toast{position:fixed;z-index:60;right:6px;bottom:25px;background:#26333d;color:#fff;padding:3px 5px;border-radius:3px;box-shadow:0 2px 5px #0005;font-size:13px}.ctx{position:fixed;z-index:100;min-width:150px;background:#fff;border:1px solid #7f8d9b;box-shadow:0 2px 7px #0005;padding:2px}.ctx[hidden]{display:none}.ctx div{padding:3px 8px;cursor:default;white-space:nowrap}.ctx div:hover{background:#e7f2fd}.ctx .sep{height:1px;padding:0;margin:2px 0;background:#ddd}@media(max-width:820px){.wide{display:none}}
</style>
</head>
<body>
<div class="top">
  <div class="tabsbar"><div id="tabs" class="tabs"></div><button id="newTab" class="newtab" title="새 탭">+</button></div>
  <div class="toolbar">
    <button id="back" class="btn" title="뒤로">◀</button><button id="forward" class="btn" title="앞으로">▶</button><button id="reload" class="btn" title="새로고침">↻</button><button id="home" class="btn" title="홈">⌂</button>
    <div class="addresswrap"><span class="lock">🔒</span><input id="address" class="address" autocomplete="off" spellcheck="false"><button id="addFav" class="star" title="현재 페이지 즐겨찾기">☆</button></div>
    <button id="favorites" class="btn iconbtn" title="즐겨찾기">🔖</button><button id="unlockBtn" class="btn iconbtn" title="선택/오른쪽 클릭 제한 해제">🖱</button><button id="printBtn" class="btn iconbtn" title="페이지 인쇄">🖨</button><button id="tools" class="btn" title="메뉴">⋮</button>
  </div>
  <div id="bookmarkBar" class="bookmarkbar"></div>
</div>
<div id="browserArea" class="browserarea"></div>
<div class="status"><span id="status" class="statusmsg">준비</span><span id="engine">Chromium / Electron</span><span id="zoom">100%</span></div>
<div id="panel" class="panel" hidden></div>
<div id="modal" class="modal" hidden><div class="card"><div class="cardhead"><strong id="modalTitle">KBrowser</strong><button id="modalClose" class="close">×</button></div><div id="modalBody" class="cardbody"></div></div></div>
<div id="ctx" class="ctx" hidden></div>
<script>
const HOME='https://www.google.com/';
let tabs=[],activeId=null,nextId=1,toastTimer=null,dragFavId=null;
const $=s=>document.querySelector(s),tabsEl=$('#tabs'),area=$('#browserArea'),address=$('#address'),status=$('#status'),panel=$('#panel'),modal=$('#modal'),modalTitle=$('#modalTitle'),modalBody=$('#modalBody'),bookmarkBar=$('#bookmarkBar'),ctx=$('#ctx');
function norm(v){v=(v||'').trim();if(!v)return HOME;if(/^[a-z][a-z0-9+.-]*:\/\//i.test(v)||/^(about:|file:|data:)/i.test(v))return v;if(!/\s/.test(v)&&/(^|\.)[\w-]+\.[a-z]{2,}/i.test(v))return'https://'+v;return'https://www.google.com/search?q='+encodeURIComponent(v)}
function tab(){return tabs.find(x=>x.id===activeId)}
function toast(s){let e=$('.toast');if(!e){e=document.createElement('div');e.className='toast';document.body.appendChild(e)}e.textContent=s;e.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.hidden=true,2600)}
function getSettings(){try{return Object.assign({showBookmarks:false,faviconOnly:false,shortNames:false,pageFont:0},JSON.parse(localStorage.getItem('kbrowser-settings')||'{}'))}catch{return{showBookmarks:false,faviconOnly:false,shortNames:false,pageFont:0}}}
function saveSettings(v){localStorage.setItem('kbrowser-settings',JSON.stringify(v));applyChromeSettings()}
function favs(){try{return JSON.parse(localStorage.getItem('kbrowser-favorites')||'[]')}catch{return[]}}
function saveFavs(v){localStorage.setItem('kbrowser-favorites',JSON.stringify(v));renderBookmarkBar();updateStar()}
function profile(){try{return Object.assign({name:'',email:'',phone:'',address:''},JSON.parse(localStorage.getItem('kbrowser-profile')||'{}'))}catch{return{name:'',email:'',phone:'',address:''}}}
function saveProfile(v){localStorage.setItem('kbrowser-profile',JSON.stringify(v))}
function faviconFor(url){try{return new URL('/favicon.ico',url).href}catch{return''}}
function shortTitle(title){return (title||'').trim().slice(0,3)}
function applyChromeSettings(){const s=getSettings();document.documentElement.classList.toggle('bookmarks-visible',!!s.showBookmarks);renderBookmarkBar();for(const t of tabs)applyPageSettings(t)}
function renderTabs(){tabsEl.innerHTML='';for(const t of tabs){const d=document.createElement('div');d.className='tab'+(t.id===activeId?' active':'');d.innerHTML='<span>🌐</span><span class="tab-title"></span><button class="tab-x">×</button>';d.querySelector('.tab-title').textContent=t.title||'새 탭';d.onclick=e=>{if(!e.target.classList.contains('tab-x'))activate(t.id)};d.querySelector('.tab-x').onclick=e=>{e.stopPropagation();closeTab(t.id)};tabsEl.appendChild(d)}updateNav();updateStar()}
async function applyCredentialAndProfile(t){if(!t?.view)return;const url=t.view.getURL()||t.url;if(!/^https?:/i.test(url))return;try{const cred=await window.kbrowserHost?.getCredential(url),p=profile(),payload={cred,p};await t.view.executeJavaScript(`(()=>{const d=${JSON.stringify(payload)};const fire=e=>{e.dispatchEvent(new Event('input',{bubbles:true}));e.dispatchEvent(new Event('change',{bubbles:true}))};const set=(el,v)=>{if(el&&!el.value&&v){el.value=v;fire(el)}};if(d.cred){const pw=document.querySelector('input[type=password]');if(pw){let u=document.querySelector('input[autocomplete=username],input[type=email],input[name*=user i],input[id*=user i],input[name*=login i],input[id*=login i],input[type=text]');set(u,d.cred.username);set(pw,d.cred.password)}}const map=[['name','input[autocomplete=name],input[name*=name i]'],['email','input[autocomplete=email],input[type=email]'],['phone','input[autocomplete=tel],input[type=tel],input[name*=phone i],input[name*=mobile i]'],['address','input[autocomplete=street-address],input[name*=address i],textarea[name*=address i]']];for(const [k,sel] of map)set(document.querySelector(sel),d.p[k]);return true})()`)}catch{}}
async function applyPageSettings(t){if(!t?.view)return;const size=Number(getSettings().pageFont||0);try{if(t.fontCssKey){await t.view.removeInsertedCSS(t.fontCssKey);t.fontCssKey=null}if(size>=9)t.fontCssKey=await t.view.insertCSS(`body,p,li,td,th,label,input,textarea,button,select,a,span{font-size:${size}px!important}`)}catch{}}
function createTab(url=HOME,activateNow=true){url=norm(url);if(url==='about:blank')return null;const id=nextId++,w=document.createElement('webview');w.className='view';w.setAttribute('partition','persist:kbrowser');w.setAttribute('allowpopups','');w.setAttribute('preload','guest-preload.js');const t={id,title:'새 탭',url,view:w,zoom:1,fontCssKey:null};tabs.push(t);area.appendChild(w);w.addEventListener('did-start-loading',()=>{if(activeId===id)status.textContent='불러오는 중...'});w.addEventListener('did-stop-loading',()=>{t.url=w.getURL()||t.url;t.title=w.getTitle()||t.title;if(activeId===id){address.value=t.url;status.textContent='준비'}renderTabs();applyPageSettings(t);applyCredentialAndProfile(t)});w.addEventListener('page-title-updated',e=>{t.title=e.title||'새 탭';renderTabs()});w.addEventListener('did-navigate',e=>{t.url=e.url;if(activeId===id)address.value=t.url;updateStar()});w.addEventListener('did-navigate-in-page',e=>{t.url=e.url;if(activeId===id)address.value=t.url;updateStar()});w.addEventListener('update-target-url',e=>{if(activeId===id)status.textContent=e.url||'준비'});w.addEventListener('dom-ready',()=>{try{w.setZoomFactor(t.zoom||1)}catch{}applyPageSettings(t);applyCredentialAndProfile(t)});w.addEventListener('ipc-message',async e=>{if(e.channel==='open-url-in-tab'){const u=e.args?.[0];if(u&&u!=='about:blank')createTab(u,true);return}if(e.channel!=='credentials-submitted')return;const data=e.args?.[0];if(!data?.password)return;let host='이 사이트';try{host=new URL(data.url).hostname}catch{}if(confirm(`${host}의 비밀번호를 Windows 암호화 저장소에 저장할까요?`)){const r=await window.kbrowserHost?.saveCredential(data.url,data.username||'',data.password);toast(r?.ok?'비밀번호를 저장했습니다.':(r?.reason||'비밀번호 저장 실패'))}});w.src='about:blank';if(activateNow)activate(id);else renderTabs();requestAnimationFrame(()=>setTimeout(()=>{if(w.isConnected)w.src=t.url},0));return id}
function activate(id){activeId=id;for(const t of tabs)t.view.classList.toggle('active',t.id===id);const t=tab();if(t)address.value=t.url||t.view.getURL()||'';renderTabs()}
function closeTab(id){const i=tabs.findIndex(t=>t.id===id);if(i<0)return;const was=activeId===id;tabs[i].view.remove();tabs.splice(i,1);if(!tabs.length)return createTab();if(was)activate(tabs[Math.min(i,tabs.length-1)].id);else renderTabs()}
function updateNav(){const t=tab();if(!t)return;try{$('#back').disabled=!t.view.canGoBack();$('#forward').disabled=!t.view.canGoForward()}catch{}$('#zoom').textContent=Math.round((t.zoom||1)*100)+'%'}
function go(){const t=tab();if(!t)return;t.url=norm(address.value);t.view.loadURL(t.url);address.value=t.url}
function updateStar(){const t=tab();if(!t)return;const url=t.view.getURL()||t.url;$('#addFav').textContent=favs().some(x=>x.url===url)?'★':'☆'}
function addFav(){const t=tab();if(!t)return;const url=t.view.getURL()||t.url;let f=favs();const i=f.findIndex(x=>x.url===url);if(i>=0){f.splice(i,1);saveFavs(f);toast('즐겨찾기에서 제거했습니다.')}else{f.unshift({id:Date.now()+Math.random(),title:t.title||url,url});saveFavs(f);toast('즐겨찾기에 추가했습니다.')}}
function reorderFavorite(fromId,toId){if(String(fromId)===String(toId))return;const f=favs(),from=f.findIndex(x=>String(x.id)===String(fromId)),to=f.findIndex(x=>String(x.id)===String(toId));if(from<0||to<0)return;const [m]=f.splice(from,1);f.splice(to,0,m);saveFavs(f)}
function renderBookmarkBar(){const s=getSettings();bookmarkBar.innerHTML='';if(!s.showBookmarks)return;for(const x of favs()){const d=document.createElement('div');d.className='bookmark'+(s.faviconOnly?' favicon-only':'');d.draggable=true;d.dataset.id=x.id;d.title=`${x.title}\n${x.url}`;const img=document.createElement('img');img.src=faviconFor(x.url);img.onerror=()=>img.style.visibility='hidden';d.appendChild(img);if(!s.faviconOnly){const sp=document.createElement('span');sp.textContent=s.shortNames?shortTitle(x.title):x.title;d.appendChild(sp)}d.onclick=()=>{const t=tab();if(t)t.view.loadURL(x.url)};d.oncontextmenu=e=>{e.preventDefault();editFavorite(x.id)};d.ondragstart=e=>{dragFavId=x.id;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(x.id))};d.ondragover=e=>{e.preventDefault();d.classList.add('dragover');e.dataTransfer.dropEffect='move'};d.ondragleave=()=>d.classList.remove('dragover');d.ondrop=e=>{e.preventDefault();d.classList.remove('dragover');reorderFavorite(dragFavId||e.dataTransfer.getData('text/plain'),x.id);dragFavId=null};d.ondragend=()=>{dragFavId=null;document.querySelectorAll('.bookmark.dragover').forEach(v=>v.classList.remove('dragover'))};bookmarkBar.appendChild(d)}}
function showFavs(){if(!panel.hidden&&panel.dataset.kind==='favs'){panel.hidden=true;return}const s=getSettings();panel.dataset.kind='favs';panel.innerHTML='<h3>즐겨찾기</h3><div class="checks"></div><div id="favList"></div>';const c=panel.querySelector('.checks');for(const [key,label] of [['showBookmarks','주소창 아래 즐겨찾기 모음 표시'],['faviconOnly','파비콘만 표시'],['shortNames','이름 3자만 표시']]){const l=document.createElement('label'),i=document.createElement('input');i.type='checkbox';i.checked=!!s[key];i.onchange=()=>{const n=getSettings();n[key]=i.checked;saveSettings(n);showFavs()};l.append(i,document.createTextNode(label));c.appendChild(l)}const list=panel.querySelector('#favList'),f=favs();if(!f.length)list.textContent='저장된 즐겨찾기가 없습니다.';for(const x of f){const d=document.createElement('div');d.className='item row';const txt=document.createElement('div');txt.className='grow';txt.innerHTML='<b></b><div class="small"></div>';txt.querySelector('b').textContent=x.title;txt.querySelector('.small').textContent=x.url;txt.onclick=()=>{tab().view.loadURL(x.url);panel.hidden=true};const e=document.createElement('button');e.className='mini';e.textContent='편집';e.onclick=ev=>{ev.stopPropagation();editFavorite(x.id)};d.append(txt,e);list.appendChild(d)}panel.hidden=false}
function editFavorite(id){const f=favs(),x=f.find(v=>String(v.id)===String(id));if(!x)return;modalTitle.textContent='즐겨찾기 편집';modalBody.innerHTML='<div class="field"><label>이름</label><input id="favTitle"></div><div class="field"><label>주소</label><input id="favUrl"></div><div class="actions"><button id="favDelete" class="mini">삭제</button><button id="favCancel" class="mini">취소</button><button id="favSave" class="mini">저장</button></div>';$('#favTitle').value=x.title;$('#favUrl').value=x.url;$('#favCancel').onclick=()=>modal.hidden=true;$('#favDelete').onclick=()=>{saveFavs(f.filter(v=>v!==x));modal.hidden=true;showFavs()};$('#favSave').onclick=()=>{x.title=$('#favTitle').value.trim()||x.url;x.url=norm($('#favUrl').value);saveFavs(f);modal.hidden=true;showFavs()};modal.hidden=false}
async function unlock(){const t=tab();if(!t)return;await t.view.executeJavaScript(`(()=>{document.oncontextmenu=null;document.onselectstart=null;document.ondragstart=null;for(const e of document.querySelectorAll('*')){e.oncontextmenu=null;e.onselectstart=null;e.style.userSelect='text';e.style.webkitUserSelect='text'}return true})()`);toast('선택/우클릭 제한 해제를 적용했습니다.')}
function printPage(){const t=tab();if(t)t.view.print()}
async function extractText(){const t=tab();if(!t)return;const text=await t.view.executeJavaScript(`document.body?document.body.innerText:''`);modalTitle.textContent='페이지 텍스트';modalBody.innerHTML='';const ta=document.createElement('textarea');ta.className='textarea';ta.value=text||'';modalBody.appendChild(ta);modal.hidden=false}
async function extractImages(){const t=tab();if(!t)return;const list=await t.view.executeJavaScript(`[...document.images].map(i=>({src:i.currentSrc||i.src,w:i.naturalWidth,h:i.naturalHeight})).filter(x=>x.src)`);modalTitle.textContent='페이지 이미지';modalBody.innerHTML='<div class="grid"></div>';const g=modalBody.firstChild;for(const x of list){const d=document.createElement('div');d.className='pic',im=document.createElement('img'),u=document.createElement('div');im.src=x.src;u.textContent=(x.w||0)+'×'+(x.h||0)+'  '+x.src;d.append(im,u);d.ondblclick=()=>window.open(x.src,'_blank');g.appendChild(d)}modal.hidden=false}
function showProfile(){const p=profile();modalTitle.textContent='자동완성 정보';modalBody.innerHTML='<div class="field"><label>이름</label><input id="pfName"></div><div class="field"><label>이메일</label><input id="pfEmail"></div><div class="field"><label>전화번호</label><input id="pfPhone"></div><div class="field"><label>주소</label><textarea id="pfAddress" rows="3"></textarea></div><div class="actions"><button id="pfCancel" class="mini">취소</button><button id="pfSave" class="mini">저장</button></div>';$('#pfName').value=p.name;$('#pfEmail').value=p.email;$('#pfPhone').value=p.phone;$('#pfAddress').value=p.address;$('#pfCancel').onclick=()=>modal.hidden=true;$('#pfSave').onclick=()=>{saveProfile({name:$('#pfName').value,email:$('#pfEmail').value,phone:$('#pfPhone').value,address:$('#pfAddress').value});modal.hidden=true;toast('자동완성 정보를 저장했습니다.')};modal.hidden=false}
async function saveCode(){const t=tab();if(!t)return;status.textContent='페이지 파일 저장 중...';const r=await window.kbrowserHost?.saveCompletePage(t.view.getWebContentsId());status.textContent='준비';if(r?.ok)toast('HTML/CSS/이미지 등 페이지 파일을 저장했습니다.');else if(!r?.canceled)toast(r?.reason||'페이지 저장 실패')}
async function toggleCapture(){const t=tab();if(!t)return;const id=t.view.getWebContentsId(),on=await window.kbrowserHost?.isRecording(id);if(!on){const r=await window.kbrowserHost?.startCapture(id);if(r?.ok)toast('Network 기록을 시작하고 페이지를 다시 불러옵니다.');else toast(r?.reason||'기록 시작 실패')}else{status.textContent='Network 기록 저장 중...';const r=await window.kbrowserHost?.stopCapture(id);status.textContent='준비';if(r?.ok)toast(`Network 기록 ${r.count}개를 저장했습니다.`);else if(!r?.canceled)toast(r?.reason||'기록 저장 실패')}}
async function showTools(){if(!panel.hidden&&panel.dataset.kind==='tools'){panel.hidden=true;return}panel.dataset.kind='tools';panel.innerHTML='<h3>KBrowser 도구</h3>';let rec=false;try{const t=tab();if(t)rec=await window.kbrowserHost?.isRecording(t.view.getWebContentsId())}catch{}const items=[['새 탭','new'],['코드 - 현재 페이지 파일 저장','code'],[rec?'애니메 - Network 기록 저장/종료':'애니메 - Network 기록 시작','anime'],['자동완성 정보','profile'],['페이지 텍스트','text'],['페이지 이미지','image'],['개발자 도구 (F12)','dev'],['확대 +','zin'],['축소 -','zout'],['100%','zreset']];for(const [n,a] of items){const d=document.createElement('div');d.className='item';d.textContent=n;d.onclick=()=>{const t=tab();if(a==='new')createTab();if(a==='code')saveCode();if(a==='anime')toggleCapture();if(a==='profile')showProfile();if(a==='text')extractText();if(a==='image')extractImages();if(a==='dev')t?.view.openDevTools();if(a==='zin'&&t){t.zoom=Math.min(3,(t.zoom||1)+.1);t.view.setZoomFactor(t.zoom)}if(a==='zout'&&t){t.zoom=Math.max(.3,(t.zoom||1)-.1);t.view.setZoomFactor(t.zoom)}if(a==='zreset'&&t){t.zoom=1;t.view.setZoomFactor(1)}panel.hidden=true;updateNav()};panel.appendChild(d)}const font=document.createElement('div');font.className='item row';font.innerHTML='<span class="grow">페이지 글꼴 크기</span><select id="pageFont" class="mini"><option value="0">원래값</option><option>12</option><option>13</option><option>14</option><option>16</option><option>18</option><option>20</option><option>24</option></select>';panel.appendChild(font);font.querySelector('select').value=String(getSettings().pageFont||0);font.querySelector('select').onchange=e=>{const s=getSettings();s.pageFont=Number(e.target.value);saveSettings(s)};panel.hidden=false}
function showAddressContext(e){e.preventDefault();e.stopPropagation();ctx.innerHTML='';const add=(name,fn)=>{const d=document.createElement('div');d.textContent=name;d.onmousedown=ev=>ev.preventDefault();d.onclick=async()=>{ctx.hidden=true;await fn()};ctx.appendChild(d)},sep=()=>{const d=document.createElement('div');d.className='sep';ctx.appendChild(d)};add('실행 취소',()=>document.execCommand('undo'));add('다시 실행',()=>document.execCommand('redo'));sep();add('잘라내기',()=>document.execCommand('cut'));add('복사',()=>document.execCommand('copy'));add('붙여넣기',async()=>{try{const text=await navigator.clipboard.readText();const a=address.selectionStart??address.value.length,b=address.selectionEnd??a;address.setRangeText(text,a,b,'end');address.dispatchEvent(new Event('input',{bubbles:true}))}catch{document.execCommand('paste')}});add('삭제',()=>{const a=address.selectionStart??0,b=address.selectionEnd??0;if(a!==b)address.setRangeText('',a,b,'end')});sep();add('전체 선택',()=>address.select());ctx.style.left=Math.min(e.clientX,window.innerWidth-170)+'px';ctx.style.top=Math.min(e.clientY,window.innerHeight-190)+'px';ctx.hidden=false}
$('#newTab').onclick=()=>createTab();$('#back').onclick=()=>{const t=tab();if(t?.view.canGoBack())t.view.goBack()};$('#forward').onclick=()=>{const t=tab();if(t?.view.canGoForward())t.view.goForward()};$('#reload').onclick=()=>tab()?.view.reload();$('#home').onclick=()=>tab()?.view.loadURL(HOME);address.onkeydown=e=>{if(e.key==='Enter')go()};address.oncontextmenu=showAddressContext;$('#addFav').onclick=addFav;$('#favorites').onclick=showFavs;$('#unlockBtn').onclick=unlock;$('#printBtn').onclick=printPage;$('#tools').onclick=showTools;$('#modalClose').onclick=()=>modal.hidden=true;modal.onmousedown=e=>{if(e.target===modal)modal.hidden=true};document.onmousedown=e=>{if(!ctx.hidden&&!ctx.contains(e.target))ctx.hidden=true;if(!panel.hidden&&!panel.contains(e.target)&&!e.target.closest('#favorites,#tools'))panel.hidden=true};document.onkeydown=e=>{if(e.ctrlKey&&e.key.toLowerCase()==='l'){e.preventDefault();address.focus();address.select()}if(e.ctrlKey&&e.key.toLowerCase()==='t'){e.preventDefault();createTab()}if(e.ctrlKey&&e.key.toLowerCase()==='w'){e.preventDefault();closeTab(activeId)}if(e.key==='F12'){e.preventDefault();tab()?.view.openDevTools()}if(e.altKey&&e.key==='ArrowLeft'&&tab()?.view.canGoBack())tab().view.goBack();if(e.altKey&&e.key==='ArrowRight'&&tab()?.view.canGoForward())tab().view.goForward()};window.kbrowserHost?.onOpenUrl(url=>{if(url&&url!=='about:blank')createTab(url,true)});applyChromeSettings();createTab();setInterval(updateNav,1200);
</script>
