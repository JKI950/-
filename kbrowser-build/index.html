<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KBrowser</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Malgun Gothic","Segoe UI",sans-serif;color:#20252a;background:#fff}button,input{font:inherit}.top{height:104px;background:linear-gradient(#f8fafc,#dce6f0);border-bottom:1px solid #84919d}.tabsbar{height:34px;display:flex;align-items:flex-end;padding:3px 5px 0;gap:3px;background:linear-gradient(#edf2f7,#cfdae5);border-bottom:1px solid #9ba7b3}.tabs{display:flex;gap:2px;flex:1;min-width:0;overflow:hidden}.tab{height:30px;min-width:110px;max-width:220px;display:flex;align-items:center;gap:5px;padding:0 7px;border:1px solid #98a5b1;border-radius:5px 5px 0 0;background:linear-gradient(#edf1f4,#c6d0da);white-space:nowrap}.tab.active{background:#fff;border-bottom-color:#fff}.tab-title{overflow:hidden;text-overflow:ellipsis;flex:1}.tab-x{border:0;background:transparent;font-size:16px}.newtab{width:30px;height:27px;margin-bottom:2px;border:1px solid #96a4b2;border-radius:4px;background:linear-gradient(#fff,#d8e2ec);font-size:19px}.toolbar{height:45px;display:flex;align-items:center;gap:4px;padding:5px 6px;background:linear-gradient(#fbfcfd,#e1e7ed);border-bottom:1px solid #adb8c3}.btn{height:31px;min-width:34px;border:1px solid #99a7b5;border-radius:4px;background:linear-gradient(#fff,#d6e0e9);padding:0 8px}.btn:hover{background:linear-gradient(#fff,#c8e3f8);border-color:#6d9ec4}.addresswrap{height:31px;display:flex;align-items:center;flex:1;border:1px solid #7f8f9f;background:#fff;border-radius:3px}.lock{width:28px;text-align:center;color:#65717a}.address{flex:1;height:27px;border:0;outline:0;padding:2px 4px}.star{width:31px;height:27px;border:0;background:transparent;font-size:20px;color:#7d8893}.browserarea{position:absolute;left:0;right:0;top:104px;bottom:24px}.view{position:absolute;inset:0;width:100%;height:100%;display:none}.view.active{display:flex}.status{position:absolute;left:0;right:0;bottom:0;height:24px;display:flex;align-items:center;gap:12px;padding:0 7px;background:linear-gradient(#f6f7f8,#dde2e6);border-top:1px solid #a3abb2;font-size:12px;color:#4c545b}.statusmsg{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.panel{position:fixed;z-index:30;right:8px;top:82px;width:390px;max-height:460px;overflow:auto;background:#fff;border:1px solid #7f8d9b;box-shadow:0 5px 18px #0004;border-radius:4px;padding:9px}.panel[hidden]{display:none}.item{padding:7px;border-bottom:1px solid #eee;cursor:pointer}.item:hover{background:#eef6fd}.small{font-size:11px;color:#687580;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.modal{position:fixed;z-index:40;inset:0;background:#0006;display:grid;place-items:center}.modal[hidden]{display:none}.card{width:min(920px,calc(100vw - 60px));height:min(650px,calc(100vh - 80px));background:#fff;border:1px solid #78848f;border-radius:5px;display:flex;flex-direction:column;overflow:hidden}.cardhead{height:40px;display:flex;align-items:center;padding:0 10px;background:linear-gradient(#fff,#dfe7ef);border-bottom:1px solid #a9b3bd}.cardhead strong{flex:1}.cardbody{flex:1;overflow:auto;padding:10px}.close{width:30px;height:26px}.textarea{width:100%;height:100%;min-height:500px;resize:none;font:12px Consolas,monospace}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}.pic{border:1px solid #ccc;padding:6px;min-height:150px}.pic img{width:100%;height:110px;object-fit:contain;background:#f1f1f1}.pic div{font-size:10px;word-break:break-all;max-height:36px;overflow:hidden}.toast{position:fixed;z-index:60;right:18px;bottom:40px;background:#26333d;color:#fff;padding:10px 14px;border-radius:5px;box-shadow:0 4px 14px #0005}@media(max-width:900px){.wide{display:none}}
</style>
</head>
<body>
<div class="top">
  <div class="tabsbar"><div id="tabs" class="tabs"></div><button id="newTab" class="newtab">+</button></div>
  <div class="toolbar">
    <button id="back" class="btn" title="뒤로">◀</button><button id="forward" class="btn" title="앞으로">▶</button><button id="reload" class="btn" title="새로고침">↻</button><button id="home" class="btn" title="홈">⌂</button>
    <div class="addresswrap"><span class="lock">🔒</span><input id="address" class="address" autocomplete="off" spellcheck="false"><button id="addFav" class="star" title="즐겨찾기">☆</button></div>
    <button id="go" class="btn">이동</button><button id="favorites" class="btn wide">즐겨찾기</button><button id="unlock" class="btn wide">제한 해제</button><button id="textTool" class="btn wide">텍스트</button><button id="imageTool" class="btn wide">이미지</button><button id="tools" class="btn">⋮</button>
  </div>
</div>
<div id="browserArea" class="browserarea"></div>
<div class="status"><span id="status" class="statusmsg">준비</span><span id="engine">Chromium / Electron</span><span id="zoom">100%</span></div>
<div id="panel" class="panel" hidden></div>
<div id="modal" class="modal" hidden><div class="card"><div class="cardhead"><strong id="modalTitle">KBrowser</strong><button id="modalClose" class="close">×</button></div><div id="modalBody" class="cardbody"></div></div></div>
<script>
const HOME='https://www.google.com/';
let tabs=[],activeId=null,nextId=1,toastTimer=null;
const $=s=>document.querySelector(s); const tabsEl=$('#tabs'),area=$('#browserArea'),address=$('#address'),status=$('#status'),panel=$('#panel'),modal=$('#modal'),modalTitle=$('#modalTitle'),modalBody=$('#modalBody');
function norm(v){v=(v||'').trim();if(!v)return HOME;if(/^[a-z][a-z0-9+.-]*:\/\//i.test(v)||/^(about:|file:|data:)/i.test(v))return v;if(!/\s/.test(v)&&/(^|\.)[\w-]+\.[a-z]{2,}/i.test(v))return'https://'+v;return'https://www.google.com/search?q='+encodeURIComponent(v)}
function tab(){return tabs.find(x=>x.id===activeId)}
function toast(s){let e=$('.toast');if(!e){e=document.createElement('div');e.className='toast';document.body.appendChild(e)}e.textContent=s;e.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.hidden=true,2500)}
function renderTabs(){tabsEl.innerHTML='';for(const t of tabs){const d=document.createElement('div');d.className='tab'+(t.id===activeId?' active':'');d.innerHTML='<span>🌐</span><span class="tab-title"></span><button class="tab-x">×</button>';d.querySelector('.tab-title').textContent=t.title||'새 탭';d.onclick=e=>{if(!e.target.classList.contains('tab-x'))activate(t.id)};d.querySelector('.tab-x').onclick=e=>{e.stopPropagation();closeTab(t.id)};tabsEl.appendChild(d)}updateNav()}
function createTab(url=HOME,activateNow=true){const id=nextId++;const w=document.createElement('webview');w.className='view';w.setAttribute('partition','persist:kbrowser');w.setAttribute('allowpopups','');const t={id,title:'새 탭',url:norm(url),view:w};tabs.push(t);area.appendChild(w);w.addEventListener('did-start-loading',()=>{if(activeId===id)status.textContent='불러오는 중...'});w.addEventListener('did-stop-loading',()=>{t.url=w.getURL()||t.url;t.title=w.getTitle()||t.title;if(activeId===id){address.value=t.url;status.textContent='준비'}renderTabs()});w.addEventListener('page-title-updated',e=>{t.title=e.title||'새 탭';renderTabs()});w.addEventListener('did-navigate',e=>{t.url=e.url;if(activeId===id)address.value=t.url});w.addEventListener('did-navigate-in-page',e=>{t.url=e.url;if(activeId===id)address.value=t.url});w.addEventListener('update-target-url',e=>{if(activeId===id)status.textContent=e.url||'준비'});w.addEventListener('dom-ready',()=>{try{w.setZoomFactor(t.zoom||1)}catch{}});w.src=t.url;if(activateNow)activate(id);else renderTabs();return id}
function activate(id){activeId=id;for(const t of tabs)t.view.classList.toggle('active',t.id===id);const t=tab();if(t)address.value=t.url||t.view.getURL()||'';renderTabs()}
function closeTab(id){const i=tabs.findIndex(t=>t.id===id);if(i<0)return;const was=activeId===id;tabs[i].view.remove();tabs.splice(i,1);if(!tabs.length)return createTab();if(was)activate(tabs[Math.min(i,tabs.length-1)].id);else renderTabs()}
function updateNav(){const t=tab();if(!t)return;try{$('#back').disabled=!t.view.canGoBack();$('#forward').disabled=!t.view.canGoForward()}catch{}$('#zoom').textContent=Math.round((t.zoom||1)*100)+'%'}
function go(){const t=tab();if(!t)return;t.url=norm(address.value);t.view.loadURL(t.url);address.value=t.url}
function favs(){try{return JSON.parse(localStorage.getItem('kbrowser-favorites')||'[]')}catch{return[]}}
function saveFavs(v){localStorage.setItem('kbrowser-favorites',JSON.stringify(v))}
function addFav(){const t=tab();if(!t)return;let f=favs();if(!f.some(x=>x.url===t.url))f.unshift({title:t.title||t.url,url:t.url});saveFavs(f);toast('즐겨찾기에 추가했습니다.')}
function showFavs(){const f=favs();panel.innerHTML='<h3>즐겨찾기</h3>'+(f.length?'':'<div>저장된 즐겨찾기가 없습니다.</div>');for(const x of f){const d=document.createElement('div');d.className='item';d.innerHTML='<b></b><div class="small"></div>';d.querySelector('b').textContent=x.title;d.querySelector('.small').textContent=x.url;d.onclick=()=>{tab().view.loadURL(x.url);panel.hidden=true};panel.appendChild(d)}panel.hidden=false}
async function unlock(){const t=tab();if(!t)return;await t.view.executeJavaScript(`(()=>{document.oncontextmenu=null;document.onselectstart=null;document.ondragstart=null;for(const e of document.querySelectorAll('*')){e.oncontextmenu=null;e.onselectstart=null;e.style.userSelect='text';e.style.webkitUserSelect='text'}return true})()`);toast('선택/우클릭 제한 해제를 적용했습니다.')}
async function extractText(){const t=tab();if(!t)return;const text=await t.view.executeJavaScript(`document.body?document.body.innerText:''`);modalTitle.textContent='페이지 텍스트';modalBody.innerHTML='';const ta=document.createElement('textarea');ta.className='textarea';ta.value=text||'';modalBody.appendChild(ta);modal.hidden=false}
async function extractImages(){const t=tab();if(!t)return;const list=await t.view.executeJavaScript(`[...document.images].map(i=>({src:i.currentSrc||i.src,w:i.naturalWidth,h:i.naturalHeight})).filter(x=>x.src)`);modalTitle.textContent='페이지 이미지';modalBody.innerHTML='<div class="grid"></div>';const g=modalBody.firstChild;for(const x of list){const d=document.createElement('div');d.className='pic';const im=document.createElement('img');im.src=x.src;const u=document.createElement('div');u.textContent=(x.w||0)+'×'+(x.h||0)+'  '+x.src;d.append(im,u);d.ondblclick=()=>window.open(x.src,'_blank');g.appendChild(d)}modal.hidden=false}
function showTools(){panel.innerHTML='<h3>KBrowser 도구</h3>';const items=[['새 탭','new'],['현재 탭 개발자 도구 (F12)','dev'],['확대 +','zin'],['축소 -','zout'],['100%','zreset'],['페이지 인쇄','print']];for(const [n,a] of items){const d=document.createElement('div');d.className='item';d.textContent=n;d.onclick=()=>{const t=tab();if(a==='new')createTab();if(a==='dev')t.view.openDevTools();if(a==='zin'){t.zoom=Math.min(3,(t.zoom||1)+.1);t.view.setZoomFactor(t.zoom)}if(a==='zout'){t.zoom=Math.max(.3,(t.zoom||1)-.1);t.view.setZoomFactor(t.zoom)}if(a==='zreset'){t.zoom=1;t.view.setZoomFactor(1)}if(a==='print')t.view.print();panel.hidden=true;updateNav()};panel.appendChild(d)}panel.hidden=false}
$('#newTab').onclick=()=>createTab();$('#back').onclick=()=>{const t=tab();if(t.view.canGoBack())t.view.goBack()};$('#forward').onclick=()=>{const t=tab();if(t.view.canGoForward())t.view.goForward()};$('#reload').onclick=()=>tab().view.reload();$('#home').onclick=()=>tab().view.loadURL(HOME);$('#go').onclick=go;address.onkeydown=e=>{if(e.key==='Enter')go()};$('#addFav').onclick=addFav;$('#favorites').onclick=showFavs;$('#unlock').onclick=unlock;$('#textTool').onclick=extractText;$('#imageTool').onclick=extractImages;$('#tools').onclick=showTools;$('#modalClose').onclick=()=>modal.hidden=true;modal.onmousedown=e=>{if(e.target===modal)modal.hidden=true};document.onmousedown=e=>{if(!panel.hidden&&!panel.contains(e.target)&&!e.target.closest('#favorites,#tools'))panel.hidden=true};document.onkeydown=e=>{if(e.ctrlKey&&e.key.toLowerCase()==='l'){e.preventDefault();address.focus();address.select()}if(e.ctrlKey&&e.key.toLowerCase()==='t'){e.preventDefault();createTab()}if(e.ctrlKey&&e.key.toLowerCase()==='w'){e.preventDefault();closeTab(activeId)}if(e.key==='F12'){e.preventDefault();tab().view.openDevTools()}if(e.altKey&&e.key==='ArrowLeft'&&tab().view.canGoBack())tab().view.goBack();if(e.altKey&&e.key==='ArrowRight'&&tab().view.canGoForward())tab().view.goForward()};window.kbrowserHost?.onOpenUrl(url=>createTab(url,true));createTab();setInterval(updateNav,800);
</script>
</body>
</html>
