name: temp-7zz-linux
on:
  push:
    branches: [chatgpt-temp-7zz-linux]
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: Download official 7-Zip Linux binary
        run: |
          set -eux
          curl -fL --retry 3 -o 7z.tar.xz https://github.com/ip7z/7zip/releases/download/26.02/7z2602-linux-x64.tar.xz
          tar -xJf 7z.tar.xz
          chmod +x 7zz
          ./7zz i | head
      - uses: actions/upload-artifact@v4
        with:
          name: 7zz-linux
          path: 7zz
          retention-days: 1
