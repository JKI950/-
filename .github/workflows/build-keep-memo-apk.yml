name: Build Keep Memo APK

on:
  push:
    branches:
      - keep-memo-android-build
    paths:
      - .github/workflows/build-keep-memo-apk.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android WebView template
        uses: actions/checkout@v4
        with:
          repository: xchacha20-poly1305/webview-apk-template
          ref: 1354b4e40efc0180d1dbb36fbfee9329b436b43e
          path: android

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Keep Memo v16 local HTML
        shell: bash
        run: |
          mkdir -p android/app/src/main/assets
          cat > /tmp/keepmemo.b64 <<'B64'
          [... ELLIPSIZATION ...]
          B64
          base64 -d /tmp/keepmemo.b64 | xz -d > android/app/src/main/assets/index.html

      - name: Configure Keep Memo v1
        shell: bash
        run: |
          cat > android/app.properties <<'EOF'
          app.url=file:///android_asset/index.html
          app.package=com.jki950.keepmemo
          app.name=Keep Memo
          app.icon_url=
          EOF
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('android/app/src/main/java/io/github/webviewtemplate/MainActivity.kt')
          s=p.read_text()
          old='webView.loadUrl(HOME_URL)'
          new='webView.loadUrl("file:///android_asset/index.html")'
          if old in s:
              s=s.replace(old,new,1)
          p.write_text(s)

          g=Path('android/app/build.gradle.kts')
          t=g.read_text()
          t=re.sub(r'versionCode\s*=\s*\d+', 'versionCode = 1', t)
          t=re.sub(r'versionName\s*=\s*"[^"]*"', 'versionName = "v1"', t)
          g.write_text(t)
          PY

      - name: Build APK
        working-directory: android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "Keep Memo.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Keep_Memo_v1_v16
          path: android/Keep Memo.apk
          if-no-files-found: error
