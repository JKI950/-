name: Build Keep Memo APK

on:
  push:
    branches:
      - keep-memo-android-build
    paths:
      - .github/workflows/build-keep-memo-apk.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android WebView template
        uses: actions/checkout@v4
        with:
          repository: xchacha20-poly1305/webview-apk-template
          ref: 1354b4e40efc0180d1dbb36fbfee9329b436b43e
          path: android

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Keep Memo local HTML
        shell: bash
        run: |
          mkdir -p android/app/src/main/assets
          cat > /tmp/keepmemo.b64 <<'B64'
          
          B64
          base64 -d /tmp/keepmemo.b64 | gunzip > android/app/src/main/assets/index.html

      - name: Configure app
        shell: bash
        run: |
          cat > android/app.properties <<'EOF'
          app.url=file:///android_asset/index.html
          app.package=com.jki950.keepmemo
          app.name=Keep Memo
          app.icon_url=
          EOF
          python - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/java/io/github/webviewtemplate/MainActivity.kt')
          s=p.read_text()
          old='webView.loadUrl(HOME_URL)'
          new='webView.loadUrl("file:///android_asset/index.html")'
          if old not in s:
              raise SystemExit('HOME load line not found')
          p.write_text(s.replace(old,new,1))
          PY

      - name: Build debug APK
        working-directory: android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Keep_Memo_Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
